[package]
name = "pixelg-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PixelGrove's library engine for the PixelG Android app, called through JNI"
license = "MIT"
publish = false

# Its own workspace, so the server's `cargo` commands don't build it.
[workspace]

[lib]
name = "pixelg"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
jni = "0.21.1"
pixelgrove = { path = "../.." }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Unwinding, like the server: `guard::contain` turns decoder panics into skipped files,
# and every JNI entry point catches the rest rather than taking the app down.
