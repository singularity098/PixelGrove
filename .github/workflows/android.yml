name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "src/**", "data/**", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/**", "data/**", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    name: PixelG APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/core
      - name: Install the NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests (the engine through JNI, and screenshots)
        run: ./gradlew testDebugUnitTest --console=plain
      # Without the release key, Gradle signs with the runner's debug key, which is new on
      # every runner: each APK then has a different signature and won't install over the
      # last one. Pushes must have the key; pull requests (no secrets) fall back to debug.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PIXELG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PIXELG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PIXELG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" = pull_request ]; then
              echo "::warning::No release keystore; the APK is signed with a throwaway debug key"
              exit 0
            fi
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing; the APK would not install over earlier ones"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pixelg.keystore"
          {
            echo "PIXELG_KEYSTORE_FILE=$RUNNER_TEMP/pixelg.keystore"
            echo "PIXELG_KEYSTORE_PASSWORD=$PIXELG_KEYSTORE_PASSWORD"
            echo "PIXELG_KEY_ALIAS=$PIXELG_KEY_ALIAS"
            echo "PIXELG_KEY_PASSWORD=${PIXELG_KEY_PASSWORD:-$PIXELG_KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: Release APK
        run: |
          ./gradlew assembleRelease --console=plain
          # PixelG-<version>.apk: the artifact is named after it.
          echo "APK=$(basename app/build/outputs/apk/release/PixelG-*.apk)" >> "$GITHUB_ENV"
      - name: The APK is signed with the release key
        if: env.PIXELG_KEYSTORE_FILE != ''
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/PixelG-*.apk | grep -i "certificate SHA-256"
      # Android won't System.loadLibrary a library with static (initial-exec) TLS: the app
      # would close at launch. Unit tests run the host build, so they can't catch it.
      - name: The engine loads on Android (no static TLS)
        run: |
          for so in app/build/rustJniLibs/*/libpixelg.so; do
            if "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d "$so" | grep -q STATIC_TLS; then
              echo "::error::$so uses static TLS; Android refuses to load it"; exit 1
            fi
          done
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APK }}
          path: android/app/build/outputs/apk/release/${{ env.APK }}
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pixelg-screenshots
          path: android/app/build/outputs/roborazzi/*.png
