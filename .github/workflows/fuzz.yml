name: Fuzz

# A short fuzzing session for every target: on pushes that touch the Rust code, weekly,
# and on demand. Longer sessions run locally (see fuzz/README.md).
on:
  push:
    branches: [main]
    paths: ["src/**", "fuzz/**", "Cargo.*", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "120"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: pip install Pillow && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 fuzz/make_seeds.py
      - run: cargo fuzz build
        working-directory: fuzz
      - name: Run targets
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            # detect_leaks: see fuzz/README.md (false positive in the http target).
            cargo fuzz run "$target" -- -max_total_time=${{ inputs.seconds || 120 }} \
              -rss_limit_mb=4096 -timeout=30 -detect_leaks=0
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
